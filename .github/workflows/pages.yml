name: Publicar PurruPublicidad
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  preparar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar imagenes y registro de cuadros
        shell: powershell
        run: '& .\.tools\Sincronizar.ps1 -Carpeta "$env:GITHUB_WORKSPACE\imagenes"'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .tools/Sitio
  publicar:
    needs: preparar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar galeria
        id: deployment
        uses: actions/deploy-pages@v4

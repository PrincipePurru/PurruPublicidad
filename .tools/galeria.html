<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PurruPublicidad</title>
<style>body{margin:0;background:#101c28;color:#edf5ff;font:17px system-ui}header,main,footer{max-width:1100px;margin:auto;padding:32px}h1{font-size:42px;margin:8px 0}small{color:#a8bfd5}#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:22px}figure{margin:0;background:#1d3043;border-radius:18px;overflow:hidden}img{width:100%;height:260px;object-fit:contain;background:#0b131c}figcaption{padding:16px}a{color:#b9defe}button{background:#b9defe;border:0;border-radius:9px;padding:10px 16px;cursor:pointer}</style>
<header><small>GALERIA CONECTADA A VRCHAT</small><h1>PurruPublicidad</h1><p>Tus cuadros, una galeria compartida.</p><p id="status">Consultando imagenes...</p><button onclick="load()">Actualizar</button></header><main id="grid"></main><footer>Las imagenes se administran desde la carpeta de tu PC y el publicador. Esta pagina es de consulta; no solicita credenciales.</footer>
<script>async function load(){try{const r=await fetch('galeria.json',{cache:'no-store'});if(!r.ok)throw Error();const list=await r.json();const grid=document.getElementById('grid');grid.replaceChildren();for(const x of list){const f=document.createElement('figure'),im=document.createElement('img'),c=document.createElement('figcaption'),a=document.createElement('a');im.src=x.archivo+'?v='+x.version;im.alt='Cuadro '+x.numero;im.loading='lazy';a.href=im.src;a.textContent='Cuadro '+x.numero+' · Abrir imagen';c.append(a);f.append(im,c);grid.append(f)}document.getElementById('status').textContent=list.length+' cuadros publicados · '+new Date().toLocaleTimeString()}catch(e){document.getElementById('status').textContent='No se pudo actualizar. Intenta nuevamente.'}}load();</script></html>
